<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Luxury Dark Canvas -->
  <rect width="64" height="64" rx="14" fill="#090D16"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#008C45" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Outer Subtle Compass Ring -->
  <circle cx="32" cy="32" r="21" stroke="#008C45" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1.2"/>

  <!-- Compass Star / Needles -->
  <!-- North Needle (Italian Emerald Green) -->
  <polygon points="32,13 36,32 32,29" fill="#008C45"/>
  <polygon points="32,13 28,32 32,29" fill="#00A852"/>

  <!-- South Needle (Subtle Crimson Red) -->
  <polygon points="32,51 36,32 32,35" fill="#991B1B"/>
  <polygon points="32,51 28,32 32,35" fill="#CD212A"/>

  <!-- East Needle (Crisp White / Slate) -->
  <polygon points="51,32 32,28 35,32" fill="#94A3B8"/>
  <polygon points="51,32 32,36 35,32" fill="#E2E8F0"/>

  <!-- West Needle (Crisp White / Slate) -->
  <polygon points="13,32 32,28 29,32" fill="#94A3B8"/>
  <polygon points="13,32 32,36 29,32" fill="#F8FAFC"/>

  <!-- Center Pivot Pin -->
  <circle cx="32" cy="32" r="3.5" fill="#090D16" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
